name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version stamp (defaults to the VERSION file)
        required: false
        default: "1.1.0"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-cairo
            mingw-w64-x86_64-python-matplotlib
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-pyinstaller
            zip

      - name: Install pure-Python dependencies
        run: python -m pip install --no-warn-script-location openpyxl keyring

      - name: Build
        run: python -m PyInstaller packaging/windows/BookShelf.spec --noconfirm

      - name: Smoke test
        run: |
          cd dist/BookShelf
          ./BookShelf.exe &
          sleep 20
          if ! tasklist | grep -i BookShelf; then
            echo "BookShelf.exe exited during the smoke test"
            exit 1
          fi
          taskkill //IM BookShelf.exe //F || true

      - name: Package
        run: |
          cd dist
          zip -r "BookShelf-${{ inputs.version }}-windows-x64.zip" BookShelf
          cd ..
          mkdir -p out
          mv "dist/BookShelf-${{ inputs.version }}-windows-x64.zip" out/

      - uses: actions/upload-artifact@v4
        with:
          name: BookShelf-${{ inputs.version }}-windows-x64
          path: out/*.zip
